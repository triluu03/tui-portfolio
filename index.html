<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tri Luu — Portfolio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0f1115;
        color: #e6e6e6;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        padding: 1rem;
      }
      main {
        max-width: 34rem;
        width: 100%;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 1rem;
      }
      p {
        color: #9aa4b2;
        margin: 0 0 1.25rem;
        line-height: 1.5;
      }
      .command-row {
        display: flex;
        align-items: stretch;
        gap: 0.75rem;
      }
      .command-box {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        padding: 1rem;
        border: 1px solid #3a4150;
        border-radius: 8px;
        background: #171a21;
        color: #7ee787;
        font-size: 1.125rem;
        overflow-wrap: anywhere;
      }
      button {
        padding: 0 1.25rem;
        border: 1px solid #3a4150;
        border-radius: 8px;
        background: #171a21;
        color: #7ee787;
        font: inherit;
        font-size: 1.125rem;
        cursor: pointer;
        white-space: nowrap;
        transition:
          border-color 120ms ease,
          background 120ms ease;
      }
      button:hover,
      button:focus-visible {
        border-color: #7ee787;
        background: #1b1f27;
        outline: none;
      }
      .hint {
        min-height: 1.5em;
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        color: #7ee787;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tri Luu — Portfolio</h1>
      <p>
        The portfolio is hosted on an SSH server. Use the command below to
        access it!
      </p>
      <div class="command-row">
        <code class="command-box">ssh triluu.dev</code>
        <button id="copy-button" type="button">Copy</button>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
    </main>
    <script>
      const command = "ssh triluu.dev";
      const button = document.getElementById("copy-button");
      const hint = document.getElementById("hint");
      let hintTimeout;

      button.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(command);
          hint.textContent = "Copied! Paste it into your terminal.";
        } catch {
          hint.textContent = "Copy failed. Select the text and copy manually.";
        }
        clearTimeout(hintTimeout);
        hintTimeout = setTimeout(() => {
          hint.textContent = "";
        }, 3000);
      });
    </script>
  </body>
</html>
